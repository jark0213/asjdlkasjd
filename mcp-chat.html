
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MCP 채팅 클라이언트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; }
        pre { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>MCP 채팅 클라이언트</h1>
    <textarea id="input" rows="4" placeholder="메시지를 입력하세요"></textarea><br><br>
    <button onclick="sendMessage()">보내기</button>
    <h2>응답:</h2>
    <pre id="response"></pre>

    <script>
    async function sendMessage() {
        const message = document.getElementById('input').value;
        const resArea = document.getElementById('response');
        resArea.textContent = "로딩 중...";

        try {
            const response = await fetch('https://mcp.nongno.com/mcp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) {
                throw new Error("HTTP 오류: " + response.status);
            }

            const data = await response.json();
            resArea.textContent = data.reply;
        } catch (error) {
            resArea.textContent = "에러: " + error;
        }
    }
    </script>
</body>
</html>
